{{define "card-stat"}}
<div class="card" id="example-stat-{{.ID}}">
  <section class="flex items-center gap-4">
    <div class="flex size-10 items-center justify-center rounded-md bg-muted text-muted-foreground shrink-0">
      {{.Icon}}
    </div>
    <div class="flex flex-col gap-0.5 mr-auto">
      <p class="text-sm text-muted-foreground">{{.Label}}</p>
      <p class="text-2xl font-semibold leading-none tabular-nums">{{.Value}}</p>
    </div>
    <span class="text-sm font-medium {{.TrendClass}}">{{.Trend}}</span>
  </section>
</div>
{{end}}
